name: Gamma Blast Signal Monitor

# Runs every minute on expiry days during the blast window
# Blast window: 2:00 PM – 3:30 PM IST = 08:30–10:00 UTC
# Tuesday  → NIFTY   expiry
# Thursday → SENSEX  expiry

on:
  schedule:
    - cron: '*/1 8-10 * * 2'   # every minute, Tuesdays   (NIFTY)
    - cron: '*/1 8-10 * * 4'   # every minute, Thursdays  (SENSEX)
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol to scan (NIFTY or SENSEX)'
        type: choice
        options:
          - NIFTY
          - SENSEX
        default: NIFTY
      test_notify:
        description: 'Send a test notification only (no market scan)'
        type: boolean
        default: false

jobs:
  scan-nifty:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '* * 2'))
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Restore NIFTY state
        if: ${{ !inputs.test_notify }}
        uses: actions/cache@v4
        with:
          path: /tmp/gb_nifty_state.json
          key: gamma-blast-nifty-state-${{ github.run_id }}
          restore-keys: |
            gamma-blast-nifty-state-

      - name: Send test notification
        if: ${{ inputs.test_notify }}
        env:
          NTFY_TOPIC: subba-gamma-blast-1987
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python scripts/gamma_blast_bot.py \
            --symbol ${{ inputs.symbol || 'NIFTY' }} \
            --test-notify

      - name: Run Gamma Blast scan — NIFTY
        if: ${{ !inputs.test_notify }}
        env:
          NTFY_TOPIC: subba-gamma-blast-1987
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python scripts/gamma_blast_bot.py \
            --symbol NIFTY \
            --once \
            --state-file /tmp/gb_nifty_state.json

      - name: Save NIFTY state
        if: ${{ !inputs.test_notify }}
        uses: actions/cache@v4
        with:
          path: /tmp/gb_nifty_state.json
          key: gamma-blast-nifty-state-${{ github.run_id }}

  scan-sensex:
    if: github.event_name == 'schedule' && contains(github.event.schedule, '* * 4')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Restore SENSEX state
        uses: actions/cache@v4
        with:
          path: /tmp/gb_sensex_state.json
          key: gamma-blast-sensex-state-${{ github.run_id }}
          restore-keys: |
            gamma-blast-sensex-state-

      - name: Run Gamma Blast scan — SENSEX
        env:
          NTFY_TOPIC: subba-gamma-blast-1987
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          python scripts/gamma_blast_bot.py \
            --symbol SENSEX \
            --once \
            --state-file /tmp/gb_sensex_state.json

      - name: Save SENSEX state
        uses: actions/cache@v4
        with:
          path: /tmp/gb_sensex_state.json
          key: gamma-blast-sensex-state-${{ github.run_id }}
